<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00A3E0" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00A3E0" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00A3E0" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Dark rounded background for crisp favicon rendering -->
  <rect width="100" height="100" rx="22" fill="#0b0f15" />
  
  <!-- Subtle cyan ambient aura -->
  <circle cx="50" cy="50" r="42" fill="url(#glow)" />

  <!-- Main stylized Experience Media 'X' emblem -->
  <!-- Primary diagonal stem -->
  <path d="M16 22 L36 22 L84 78 L64 78 Z" fill="#FFFFFF" />

  <!-- Accent crossing wings with cyan gradient -->
  <path d="M84 22 L66 22 L52 39 L62 48 Z" fill="url(#cyanGrad)" />
  <path d="M22 72 L32 78 L48 59 L38 50 Z" fill="url(#cyanGrad)" />

  <!-- Dynamic forward velocity rays -->
  <line x1="20" y1="36" x2="42" y2="58" stroke="#00A3E0" stroke-width="2.5" stroke-linecap="round" />
  <line x1="24" y1="44" x2="46" y2="66" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
  <line x1="28" y1="52" x2="50" y2="74" stroke="#00A3E0" stroke-width="1.5" stroke-linecap="round" />
</svg>
